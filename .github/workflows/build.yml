name: Build Flatpak

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Podman Flatpak build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Podman
        run: |
          command -v podman
          podman --version

      - name: Run container tests
        run: scripts/container-test.sh

      - name: Build Flatpak
        run: scripts/container-build.sh

      - name: Create installable bundle
        run: scripts/container-bundle.sh

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: myna-flatpak
          path: dist/com.canonical.Myna.flatpak
          if-no-files-found: error
          retention-days: 14
