id: com.canonical.Myna.Whisper
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: myna-whisper-server

# ─── Permissions ───────────────────────────────────────────────────────────
# The inference backend has NO microphone access and NO display access.
# Audio arrives as PCM pushed over the shared Unix socket by the client.
finish-args:
  - --socket=session-bus
  # Shared IPC directory: same path the client uses
  - --filesystem=xdg-run/myna:create
  # /sys and /proc reads for CPU topology and cgroup quota
  - --device=all

build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
    PIP_NO_INDEX: '1'

modules:
  # ── Python dependencies (faster-whisper, ctranslate2, websockets, numpy) ─
  # Generated by flatpak-pip-generator with SHA256-verified binary wheels.
  - python3-requirements-whisper.json

  # ── Myna server application ──────────────────────────────────────────────
  - name: myna-server
    buildsystem: simple
    build-commands:
      # Install pure Python myna package directly into site-packages
      - mkdir -p /app/lib/python3.13/site-packages
      - cp -r server/src/myna /app/lib/python3.13/site-packages/

      # Install myna-server CLI entry point
      - |
        cat << 'EOF' > /app/bin/myna-server
        #!/usr/bin/env python3
        import sys
        from myna.server.cli import main
        if __name__ == '__main__':
            sys.exit(main())
        EOF
        chmod +x /app/bin/myna-server

      # Install server launcher and model downloader
      - install -Dm755 whisper-server       /app/bin/myna-whisper-server
      - install -Dm755 myna-download-model  /app/bin/myna-download-model

      # Install systemd user service unit
      - install -Dm644 com.canonical.Myna.Whisper.service
          /app/share/systemd/user/com.canonical.Myna.Whisper.service

      # Install AppStream metadata
      - install -Dm644 com.canonical.Myna.Whisper.metainfo.xml
          /app/share/metainfo/com.canonical.Myna.Whisper.metainfo.xml

    sources:
      # Upstream Myna repo containing server/
      - type: git
        url: https://github.com/canonical/myna.git
        commit: f9ddecc8888815e3a732b7b40071e552bab02bab

      # Packaging integration files
      - type: file
        path: scripts/whisper-server
      - type: file
        path: scripts/myna-download-model
      - type: file
        path: services/com.canonical.Myna.Whisper.service
      - type: file
        path: com.canonical.Myna.Whisper.metainfo.xml

# ─── Flatpak Extensions ────────────────────────────────────────────────────
# Model weights ship as Flatpak extensions (analogous to snap components).
# Each extension is an independent Flatpak that contributes a read-only
# mount at /app/extensions/models/<size>/ at runtime.
add-extensions:
  com.canonical.Myna.Whisper.Model.Tiny:
    directory: extensions/models/tiny
    autodelete: true
    no-autodownload: true
    subdirectories: false

  com.canonical.Myna.Whisper.Model.Base:
    directory: extensions/models/base
    autodelete: true
    no-autodownload: false
    subdirectories: false

  com.canonical.Myna.Whisper.Model.Small:
    directory: extensions/models/small
    autodelete: true
    no-autodownload: true
    subdirectories: false

  com.canonical.Myna.Whisper.Model.LargeV3:
    directory: extensions/models/large-v3
    autodelete: true
    no-autodownload: true
    subdirectories: false

  com.canonical.Myna.Whisper.Model.LargeV3Turbo:
    directory: extensions/models/large-v3-turbo
    autodelete: true
    no-autodownload: true
    subdirectories: false

  com.canonical.Myna.Whisper.GpuNvidia:
    directory: extensions/gpu-nvidia
    autodelete: true
    no-autodownload: true
    subdirectories: false
