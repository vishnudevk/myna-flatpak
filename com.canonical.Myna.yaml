id: com.canonical.Myna
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: myna-config

# --- Permissions ---
# Only the client has microphone/audio and desktop access.
# The inference backend gets no audio hardware access (matches the snap security model).
finish-args:
  # Wayland / X11 display (for myna-hud overlay and myna-config GTK4 settings UI)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # PipeWire audio capture - accessed directly and via portal
  - --device=all
  # IBus text injection and desktop notifications over session bus
  - --socket=session-bus
  # Host dconf reading (for keybinding integration)
  - --filesystem=xdg-config/dconf:ro
  # Shared IPC directory so backend Flatpaks drop their socket and provider.env
  - --filesystem=xdg-run/myna:create
  # Home filesystem access (for myna-testbed WAV clip testing)
  - --filesystem=home

modules:
  # ─────────────────────────────────────────────────────────────────────────
  # Myna Rust client workspace
  # Builds:
  #   - myna-desktop: the dictation daemon, toggle & status logic
  #   - myna-hud: GTK4/Adwaita overlay showing dictation state without focus
  #   - myna-config: GTK4/Adwaita Myna Settings GUI application
  #   - myna-testbed: development CLI for testing audio & dialect sessions
  #
  # Offline Cargo build (Flathub-compatible):
  #   cargo-sources.json was generated from client/Cargo.lock via
  #   flatpak-cargo-generator.py. Each crate archive is downloaded into
  #   cargo/vendor/, and .cargo/config.toml redirects crates-io to that tree.
  # ─────────────────────────────────────────────────────────────────────────
  - name: myna
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/myna/cargo
        RUST_BACKTRACE: '1'
        # Point bindgen (used by pipewire-sys) to libclang in llvm20 SDK extension
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        # Point PipeWire SPA plugins and modules to GNOME platform paths
        SPA_PLUGIN_DIR: /usr/lib/x86_64-linux-gnu/spa-0.2
        PIPEWIRE_MODULE_DIR: /usr/lib/x86_64-linux-gnu/pipewire-0.3
    build-commands:
      # ── Offline Cargo config ────────────────────────────────────────────
      - mkdir -p .cargo
      - |
        cat >> .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "cargo/vendor"
        EOF

      # ── Version staging ─────────────────────────────────────────────────
      # Avoid depending on git rev-parse during sandbox build
      - echo "0.2.3" > client/.version

      # ── Cargo builds (all offline, locked) ──────────────────────────────
      - cargo install -f --locked --path client/myna-desktop --root /app
      - cargo install -f --locked --path client/myna-cli     --root /app
      - cargo install -f --locked --path client/myna-hud     --root /app
      - cargo install -f --locked --path client/myna-config  --root /app
      - rm -f /app/.crates.toml /app/.crates2.json

      # Strip DWARF debuginfo, keeping symbols for panic backtraces
      - strip --strip-debug /app/bin/myna-desktop /app/bin/myna-testbed /app/bin/myna-hud /app/bin/myna-config

      # ── GSettings schema ────────────────────────────────────────────────
      - |
        install -Dm644 \
          client/data/glib-2.0/schemas/com.canonical.Myna.Dictation.gschema.xml \
          /app/share/glib-2.0/schemas/com.canonical.Myna.Dictation.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas

      # ── Gettext translations ────────────────────────────────────────────
      - |
        for po in client/myna-desktop/po/*.po client/myna-orchestrator/po/*.po; do
          [ -f "$po" ] || continue
          lang=$(basename "$po" .po)
          domain=$(basename "$(dirname "$(dirname "$po")")")
          mkdir -p "/app/share/locale/$lang/LC_MESSAGES"
          msgfmt "$po" -o "/app/share/locale/$lang/LC_MESSAGES/$domain.mo"
        done

      # ── Launcher scripts ────────────────────────────────────────────────
      - install -Dm755 myna-daemon          /app/bin/myna-daemon
      - install -Dm755 myna-status          /app/bin/myna-status
      - install -Dm755 myna-toggle          /app/bin/myna-toggle
      - install -Dm755 myna-testbed-wrapper /app/bin/myna-testbed-wrapper

      # ── Desktop & AppStream metadata ────────────────────────────────────
      - install -Dm644 com.canonical.Myna.desktop
          /app/share/applications/com.canonical.Myna.desktop
      - install -Dm644 com.canonical.Myna.metainfo.xml
          /app/share/metainfo/com.canonical.Myna.metainfo.xml
      - install -Dm644 client/myna-config/data/com.canonical.Myna.Config.desktop
          /app/share/applications/com.canonical.Myna.Config.desktop
      - install -Dm644 client/myna-config/data/com.canonical.Myna.Config.metainfo.xml
          /app/share/metainfo/com.canonical.Myna.Config.metainfo.xml

      # ── Application icons ───────────────────────────────────────────────
      - install -Dm644 client/data/icons/hicolor/scalable/apps/com.canonical.Myna.svg
          /app/share/icons/hicolor/scalable/apps/com.canonical.Myna.svg
      - install -Dm644 client/data/icons/hicolor/scalable/apps/com.canonical.Myna.Config.svg
          /app/share/icons/hicolor/scalable/apps/com.canonical.Myna.Config.svg

      # ── Systemd user service unit ───────────────────────────────────────
      - install -Dm644 com.canonical.Myna.service
          /app/share/systemd/user/com.canonical.Myna.service

    sources:
      # Upstream Myna source
      - type: git
        url: https://github.com/canonical/myna.git
        commit: c1bd11cf487de4bc273c74106ba9bd5bfc82eaf2

      # Packaging helper scripts & integration files
      - type: file
        path: scripts/myna-daemon
      - type: file
        path: scripts/myna-status
      - type: file
        path: scripts/myna-toggle
      - type: file
        path: scripts/myna-testbed-wrapper
      - type: file
        path: com.canonical.Myna.desktop
      - type: file
        path: com.canonical.Myna.metainfo.xml
      - type: file
        path: services/com.canonical.Myna.service

      # Vendored Cargo crates (517 crates, checksum-verified)
      - cargo-sources.json
